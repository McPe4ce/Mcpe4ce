<svg width="860" height="180" viewBox="0 0 860 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .main { font: bold 72px 'Courier New', Courier, monospace; fill: #FCEE0A; }
      .cyan { fill: #00E5FF; }
      .red  { fill: #FF003C; }
      .sub  { font: 13px 'Courier New', Courier, monospace; fill: #00E5FF; letter-spacing: 10px; }
      .tag  { font: 11px 'Courier New', Courier, monospace; fill: #444c56; letter-spacing: 3px; }
      .glow {
        filter: drop-shadow(0 0 6px #FCEE0A) drop-shadow(0 0 22px #FCEE0A88);
        animation: pulse 3s ease-in-out infinite;
      }
      .gt { animation: glitch-top 5s infinite; }
      .gb { animation: glitch-bot 5s infinite; }
      .sf { animation: flicker 6s infinite; }
      .bar { animation: bar-blink 2s step-end infinite; }
      @keyframes glitch-top {
        0%,88%,100% { transform:translateX(0); opacity:0; }
        90%  { transform:translateX(-7px); opacity:.9; }
        92%  { transform:translateX(7px);  opacity:0; }
        94%  { transform:translateX(-3px); opacity:.5; }
        96%  { opacity:0; }
      }
      @keyframes glitch-bot {
        0%,86%,100% { transform:translateX(0); opacity:0; }
        88%  { transform:translateX(7px);  opacity:.8; }
        90%  { transform:translateX(-7px); opacity:0; }
        92%  { transform:translateX(3px);  opacity:.45; }
        94%  { opacity:0; }
      }
      @keyframes pulse {
        0%,100% { filter: drop-shadow(0 0 5px #FCEE0A) drop-shadow(0 0 16px #FCEE0A66); }
        50%     { filter: drop-shadow(0 0 14px #FCEE0A) drop-shadow(0 0 38px #FCEE0AAA); }
      }
      @keyframes flicker {
        0%,45%,47%,100% { opacity:1; }
        46% { opacity:.08; }
      }
      @keyframes bar-blink {
        0%,49% { opacity:1; }
        50%,100% { opacity:0; }
      }
    </style>
    <clipPath id="ct">
      <rect x="0" y="0" width="860" height="88"/>
    </clipPath>
    <clipPath id="cb">
      <rect x="0" y="104" width="860" height="76"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect fill="#0D1117" width="860" height="180"/>

  <!-- Subtle grid lines -->
  <line x1="0"   y1="60"  x2="860" y2="60"  stroke="#FCEE0A" stroke-width="0.3" opacity="0.08"/>
  <line x1="0"   y1="120" x2="860" y2="120" stroke="#FCEE0A" stroke-width="0.3" opacity="0.08"/>
  <line x1="215" y1="0"   x2="215" y2="180" stroke="#FCEE0A" stroke-width="0.3" opacity="0.05"/>
  <line x1="430" y1="0"   x2="430" y2="180" stroke="#FCEE0A" stroke-width="0.3" opacity="0.05"/>
  <line x1="645" y1="0"   x2="645" y2="180" stroke="#FCEE0A" stroke-width="0.3" opacity="0.05"/>

  <!-- Top/bottom accent lines -->
  <line x1="20" y1="16"  x2="840" y2="16"  stroke="#FCEE0A" stroke-width="0.8" opacity="0.35"/>
  <line x1="20" y1="164" x2="840" y2="164" stroke="#FCEE0A" stroke-width="0.8" opacity="0.35"/>

  <!-- Corner brackets — cyan -->
  <polyline points="8,8  8,34  34,34"  fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.7"/>
  <polyline points="852,8  852,34  826,34" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.7"/>
  <polyline points="8,172  8,146  34,146" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.7"/>
  <polyline points="852,172 852,146 826,146" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.7"/>

  <!-- Corner dot accents -->
  <rect x="5"   y="5"   width="4" height="4" fill="#FCEE0A" opacity="0.6"/>
  <rect x="851" y="5"   width="4" height="4" fill="#FCEE0A" opacity="0.6"/>
  <rect x="5"   y="171" width="4" height="4" fill="#FCEE0A" opacity="0.6"/>
  <rect x="851" y="171" width="4" height="4" fill="#FCEE0A" opacity="0.6"/>

  <!-- Top tag -->
  <text x="430" y="38" text-anchor="middle" class="tag">◈  NECROTECH HYDRA v2.1  ◈  PERSONAL NODE ACTIVE  ◈</text>

  <!-- Glitch copy — top slice (cyan) -->
  <g clip-path="url(#ct)" class="gt">
    <text x="430" y="104" text-anchor="middle" class="main cyan">MCPE4CE</text>
  </g>

  <!-- Glitch copy — bottom slice (red) -->
  <g clip-path="url(#cb)" class="gb">
    <text x="430" y="104" text-anchor="middle" class="main red">MCPE4CE</text>
  </g>

  <!-- Main glowing title -->
  <text x="430" y="104" text-anchor="middle" class="main glow">MCPE4CE</text>

  <!-- Subtitle with flicker + blinking cursor -->
  <text x="430" y="144" text-anchor="middle" class="sub sf">[ ROOKIE NETRUNNER ]</text>
  <rect x="624" y="131" width="8" height="14" fill="#00E5FF" class="bar" opacity="0.8"/>

  <!-- Bottom tag -->
  <text x="430" y="158" text-anchor="middle" class="tag">NODE: ONLINE  ·  STATUS: BUILDING  ·  UPTIME: COMMITTING DAILY</text>
</svg>
